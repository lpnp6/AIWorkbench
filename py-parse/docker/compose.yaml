# Regular/dev environment: the full production stack plus a read-only mount of
# the host book directory.
#
# The only difference from compose.prod.yaml is that celery-worker gets the book
# directory mounted, so workers read file:// sources directly from their own
# filesystem and the benchmark script does not need to docker-cp them (run it
# with --stage none).
#
#   Infra:     docker compose -f ../compose.infra.yaml up -d --wait   # once
#   Start:     docker compose -f docker/compose.yaml up -d --build
#   One GPU:   keep a single MinerU engine and let both workers share it:
#                MINERU_REPLICAS=1 WORKER_REPLICAS=2 CELERY_WORKER_CONCURRENCY=4 \
#                  docker compose -f docker/compose.yaml up -d
#   Benchmark: python scripts/benchmark_parse.py --root D:/MMLongBench-Doc/documents
#              (the script detects this mount and skips staging)
#
# Override the host directory with BOOKS_DIR (default D:/MMLongBench-Doc/documents).
# For production use compose.prod.yaml: it mounts no host directory and does not
# depend on a book library path. Service docs (MinerU, scaling, health checks)
# live in compose.prod.yaml.

name: py-parse

include:
  - path: compose.prod.yaml

services:
  celery-worker:
    volumes:
      # Every replica shares the same read-only mount, so whichever worker picks
      # up a task can read the source file.
      - type: bind
        source: ${BOOKS_DIR:-D:/MMLongBench-Doc/documents}
        target: /data/books
        read_only: true
