syntax = "proto3";

package parse.v1;

import "google/protobuf/timestamp.proto";

// py-parser's external service contract (gRPC, async task model).
//
// Design points:
//   - Async: `SubmitParse` enqueues a parse task and returns a `task_id`
//     immediately; the caller polls `GetResult` for status and (when done)
//     the chunks. Heavy parsing runs in a separate worker pool (Celery).
//   - `source` is a uniform URI; the scheme selects the storage backend, the
//     remainder is the location within that backend.
//   - The request carries only *location* (doc_id + source). Connection config
//     (endpoints / credentials) lives in the config center, never in the request.
service ParseService {
  // Enqueue a parse task. Returns immediately with a task_id for polling.
  // One task per source: a submit whose source already has a task (any status)
  // is rejected with ALREADY_EXISTS. Retry a FAILED task with RequeueParse.
  rpc SubmitParse(ParseRequest) returns (SubmitParseResponse);
  // Poll task status and (once SUCCESS) fetch the parsed chunks.
  rpc GetResult(GetResultRequest) returns (GetResultResponse);
  // Retry a FAILED task by creating a NEW task for the same document. The
  // original record is never mutated: its status and error stay as they were,
  // and the response carries the id of the new task to poll.
  rpc RequeueParse(RequeueParseRequest) returns (RequeueParseResponse);
  // List tasks of every status, newest first, deduplicated by source: a source
  // may have several rows (each retry adds one and leaves the old one), and
  // only the row with the most recent status is reported. An optional source
  // list narrows the report to those sources, which is how a caller decides
  // per source whether to submit, skip or requeue.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
}

message ParseRequest {
  // Logical identity of the document (business key, storage-agnostic; used for
  // provenance, status tracking, and chunk-id prefixing).
  string doc_id = 1;
  // Uniform resource URI: file:///... | minio://... | s3://... | oss://...
  string source = 2;
}

message SubmitParseResponse {
  string task_id = 1;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_SUCCESS = 3;
  TASK_STATUS_FAILED = 4;
}

message GetResultRequest {
  string task_id = 1;
}

message GetResultResponse {
  string task_id = 1;
  TaskStatus status = 2;
  // Set only when status == FAILED.
  string error = 3;
  // Set only when status == SUCCESS: the summary (chunk_count + doc_meta).
  ParseResult result = 4;
  // Set only when status == SUCCESS: the parsed chunks.
  repeated ParseChunk chunks = 5;
}

message ParseChunk {
  string chunk_id = 1;
  string text = 2;
  ChunkMetadata metadata = 3;
}

message ChunkMetadata {
  int32 page = 1;
  string heading = 2;
  string chunk_type = 3;   // "text" | "table" | "code" | "image"
}

message ParseResult {
  int32 chunk_count = 1;
  DocMeta doc_meta = 2;
}

message DocMeta {
  int32 total_pages = 1;
  string title = 2;
  string warning = 3;
}

message RequeueParseRequest {
  // The FAILED task to retry. Only FAILED tasks are accepted.
  string task_id = 1;
}

message RequeueParseResponse {
  // The newly created task (initially PENDING). Poll GetResult with this id.
  string task_id = 1;
  // The FAILED task this one retries, kept for lineage.
  string requeued_from = 2;
}

message ListTasksRequest {
  // Optional filter: only tasks whose source is one of these URIs are
  // returned. Empty means "every source".
  repeated string sources = 1;
}

message ListTasksResponse {
  repeated TaskSummary tasks = 1;
}

// One task per source: the row carrying that source's most recent status.
message TaskSummary {
  string task_id = 1;
  string doc_id = 2;
  string source = 3;
  TaskStatus status = 4;
  // Set only when status == FAILED.
  string error = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
